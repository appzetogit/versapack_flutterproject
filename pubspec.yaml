name: quick_commerce_user
description: "Appzeto Quick — premium quick-commerce user app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Images / loading
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Local persistence
  shared_preferences: ^2.3.3

  # Typography & motion
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Platform
  connectivity_plus: ^6.1.0
  share_plus: ^10.1.2

  # Real-time customer↔rider chat. Server is Socket.IO v4
  # (Backend/package.json), so the client must be the v4-capable 3.x line.
  socket_io_client: ^3.1.2

  # The pull-to-refresh cue in assets/sound/. Playback only — no recording,
  # no background audio session.
  audioplayers: ^6.1.0

  # Maps & location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2

  # Payments. Checkout is opened by the app; the order and the signature check
  # both live on the backend (`POST /food/orders` → `POST /food/orders/verify-payment`).
  razorpay_flutter: ^1.3.7

  # Push (FCM). The backend sends to the `high_importance_channel` Android
  # channel declared in AndroidManifest.xml.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Lets the resend-countdown test elapse timers without sleeping for real.
  fake_async: ^1.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Pull-to-refresh cue. Was on disk but never declared, so it was not
    # bundled into the app at all.
    - assets/sound/
    # Runtime config (gitignored keys.env + the checked-in example). Read by
    # AppConfig.load() so the app is configured without a launch flag.
    - config/
