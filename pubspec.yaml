name: quick_commerce_user
description: "Suvio Quick — premium quick-commerce user app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Images / loading
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Local persistence
  shared_preferences: ^2.3.3

  # Typography & motion
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # Platform
  connectivity_plus: ^6.1.0
  share_plus: ^10.1.2

  # Maps & location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Lets the resend-countdown test elapse timers without sleeping for real.
  fake_async: ^1.3.2

flutter:
  uses-material-design: true
